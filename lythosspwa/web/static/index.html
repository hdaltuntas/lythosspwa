<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lythos SPWA</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Lythos SPWA <span id="tagline"></span></h1>
  <div class="spacer"></div>
  <label class="inline"><span id="lblLanguage"></span>
    <select id="language"></select>
  </label>
  <button id="btnOpen"></button>
  <button id="btnSave"></button>
  <label class="inline"><span id="lblReport"></span>
    <select id="reportFormat"></select>
  </label>
  <button id="btnReport"></button>
  <button id="btnTheme" class="icon" title="">◐</button>
  <input type="file" id="fileInput" accept=".spwa,.json" hidden>
</header>

<nav class="modules">
  <button data-module="inputs" class="active" id="tabInputs"></button>
  <button data-module="study" id="tabStudy"></button>
</nav>

<main>
  <!-- ------------------------------------------------------- left: inputs -->
  <aside class="left">
    <section id="paneInputs">
      <div class="actions">
        <button id="btnAnalyse" class="primary"></button>
      </div>
      <div id="projectForm"></div>

      <h2 id="lblSoil"></h2>
      <div class="table-wrap">
        <table class="grid" id="soilTable">
          <thead><tr id="soilHead"></tr></thead>
          <tbody id="soilBody"></tbody>
        </table>
      </div>
      <div class="row">
        <button data-table="soil" class="add"></button>
        <button data-table="soil" class="del"></button>
      </div>

      <h2 id="lblAnchors"></h2>
      <div class="table-wrap">
        <table class="grid" id="anchorTable">
          <thead><tr id="anchorHead"></tr></thead>
          <tbody id="anchorBody"></tbody>
        </table>
      </div>
      <div class="row">
        <button data-table="anchors" class="add"></button>
        <button data-table="anchors" class="del"></button>
      </div>

      <div id="structureForm"></div>
    </section>

    <section id="paneStudy" hidden>
      <div class="actions">
        <button id="btnStudy" class="primary"></button>
        <button id="btnCancel"></button>
        <button id="btnCsv"></button>
        <button id="btnXlsx"></button>
      </div>

      <h2 id="lblStudyVars"></h2>
      <div class="table-wrap">
        <table class="grid" id="studyTable">
          <thead><tr id="studyHead"></tr></thead>
          <tbody id="studyBody"></tbody>
        </table>
      </div>
      <div class="row">
        <button data-table="study" class="add"></button>
        <button data-table="study" class="del"></button>
      </div>

      <div id="studyForm"></div>
    </section>
  </aside>

  <!-- ------------------------------------------------------ right: results -->
  <div class="results">
    <div class="tabs" id="viewTabs"></div>
    <div class="picker" id="picker" hidden>
      <label class="inline"><span id="lblFigure"></span>
        <select id="figure"></select>
      </label>
      <label class="inline" id="outputWrap" hidden><span id="lblOutput"></span>
        <select id="output"></select>
      </label>
    </div>
    <div class="view" id="view"></div>
  </div>
</main>

<div id="statusBar">
  <span class="msg" id="statusMsg"></span>
  <div class="bar"><div id="progressBar"></div></div>
  <span id="statusRight"></span>
</div>

<script src="/static/app.js"></script>
</body>
</html>
